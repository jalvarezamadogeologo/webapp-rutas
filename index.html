<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f2933">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="iconos/icon-192.png">
  <title>webapp-rutas</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="barra">
    <h1>Rutas</h1>
    <div class="barra-acciones">
      <button id="btnUbicacion" class="btn-ubicacion" title="Ir a mi ubicacion" aria-label="Ir a mi ubicacion">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
        </svg>
      </button>
      <button id="btnCapa" class="btn-secundario">Satelite</button>
      <button id="btnLista" class="btn-secundario">Guardadas</button>
    </div>
  </header>

  <div id="mapa"></div>

  <div id="estadoGrabacion" class="estado"></div>
  <div id="avisoWakelock" class="aviso-wakelock" hidden>
    Pantalla puede apagarse y cortar la grabacion. Manten la pantalla encendida.
  </div>

  <footer id="controles" class="controles">
    <div class="controles-botones">
      <button id="btnPlay" class="btn-control btn-play">Play</button>
      <button id="btnPause" class="btn-control">Pausa</button>
      <button id="btnStop" class="btn-control btn-stop">Stop</button>
      <button id="btnPunto" class="btn-control btn-punto">+ Punto</button>
    </div>
    <div id="infoEnVivo" class="info-vivo">—</div>
  </footer>

  <!-- Modal guardar ruta -->
  <div id="modalGuardar" class="modal">
    <div class="modal-caja">
      <h2>Guardar ruta</h2>
      <label for="inputNombre">Nombre</label>
      <input id="inputNombre" type="text" placeholder="Ej: Cerro La Campana" autocomplete="off">
      <label for="inputDescripcion">Descripcion (opcional)</label>
      <textarea id="inputDescripcion" rows="2" placeholder="Contexto de la ruta..."></textarea>
      <div id="zonaGuardarStats"></div>
      <canvas id="canvasGuardar" class="perfil"></canvas>
      <div id="zonaGuardarEstado" class="estado-guardado"></div>
      <div class="modal-acciones">
        <button id="btnCancelarGuardar" class="btn-secundario" data-cerrar="modalGuardar">Cancelar</button>
        <button id="btnConfirmarGuardar" class="btn-primario">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal agregar punto -->
  <div id="modalPunto" class="modal">
    <div class="modal-caja">
      <h2>Agregar punto</h2>
      <label for="inputPuntoNombre">Nombre</label>
      <input id="inputPuntoNombre" type="text" placeholder="Ej: Mirador, cruce de sendero" autocomplete="off">
      <label for="inputPuntoDesc">Descripcion (opcional)</label>
      <textarea id="inputPuntoDesc" rows="2" placeholder="Detalle del punto..."></textarea>
      <div class="modal-acciones">
        <button id="btnCancelarPunto" class="btn-secundario" data-cerrar="modalPunto">Cancelar</button>
        <button id="btnConfirmarPunto" class="btn-primario">Guardar punto</button>
      </div>
    </div>
  </div>

  <!-- Modal sesion en curso (grabacion interrumpida por pantalla apagada) -->
  <div id="modalSesion" class="modal">
    <div class="modal-caja">
      <h2>Grabacion en curso</h2>
      <p class="sesion-info">Se encontro una grabacion sin terminar. Podes continuarla o descartarla.</p>
      <p id="sesionInfo" class="sesion-info sesion-dato"></p>
      <div class="modal-acciones">
        <button id="btnSesionDescartar" class="btn-secundario">Descartar</button>
        <button id="btnSesionContinuar" class="btn-primario">Continuar</button>
      </div>
    </div>
  </div>

  <!-- Modal detalle de ruta guardada -->
  <div id="modalDetalle" class="modal">
    <div class="modal-caja">
      <h2 id="detalleTitulo"></h2>
      <p id="detalleFecha" class="detalle-fecha"></p>
      <p id="detalleDesc" class="detalle-desc" style="display:none"></p>
      <div id="detalleStats"></div>
      <p id="detalleAlturaEstado" class="detalle-altura"></p>
      <canvas id="canvasDetalle" class="perfil"></canvas>
      <div id="replayControles" class="replay-controles" style="display:none">
        <button id="btnReplayPlay" class="btn-secundario">Reproducir</button>
        <button id="btnReplayVel" class="btn-secundario">1x</button>
        <button id="btnReplayReiniciar" class="btn-secundario">Reiniciar</button>
        <span id="replayEstado" class="replay-estado"></span>
      </div>
      <div class="modal-acciones">
        <button id="btnExportarDetalleGPX" class="btn-secundario">Exportar GPX</button>
        <button id="btnExportarDetalleJSON" class="btn-secundario">Exportar JSON</button>
        <button id="btnCorregirAlturas" class="btn-secundario" style="display:none">Corregir alturas SRTM</button>
        <button class="btn-primario" data-cerrar="modalDetalle">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Panel listado -->
  <div id="panelLista" class="modal panel-lista">
    <div class="modal-caja">
      <div class="panel-cab">
        <h2>Rutas guardadas</h2>
        <button id="btnCerrarLista" class="btn-secundario" data-cerrar="panelLista">Cerrar</button>
      </div>
      <div id="listaRutas"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
